<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warning — Suspicious Link</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #ff3b30;
            border-radius: 12px;
            max-width: 540px;
            width: 100%;
            padding: 40px 36px;
            box-shadow: 0 0 40px rgba(255, 59, 48, 0.15);
        }

        .warning-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ff3b30;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .info-block {
            background: #111;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .info-block label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #555;
            margin-bottom: 4px;
        }

        .info-block .value {
            font-size: 14px;
            font-family: "SF Mono", "Fira Code", monospace;
            color: #e0e0e0;
        }

        .slug-value {
            color: #ff453a;
        }

        .domain-value {
            color: #ff9f0a;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            border: none;
            transition: opacity 0.15s;
        }

        .btn:hover { opacity: 0.85; }

        .btn-go {
            background: #ff3b30;
            color: #fff;
        }

        .btn-back {
            background: #2a2a2a;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="warning-icon">⚠️</div>
        <h1>Suspicious Link Detected</h1>
        <p class="subtitle">
            This URL was flagged as potentially deceptive. Review the destination
            before proceeding — you are about to leave this page.
        </p>

        <div class="info-block">
            <label>Scary link you clicked</label>
            <span class="value slug-value">{{ slug }}</span>
        </div>

        <div class="info-block">
            <label>Actual destination domain</label>
            <span class="value domain-value">{{ domain }}</span>
        </div>

        <div class="info-block">
            <label>Full destination URL</label>
            <span class="value">{{ original_url }}</span>
        </div>

        <div class="actions">
            <a class="btn btn-back" href="javascript:history.back()">Go Back</a>
            <a class="btn btn-go" href="{{ request.url.path }}/go">Proceed Anyway</a>
        </div>
    </div>
</body>
</html>
